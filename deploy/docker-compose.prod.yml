services:
  db:
    networks: [default, instrument_qc]
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    networks: [default, instrument_qc]
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
    restart: unless-stopped
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "
    env_file:
      - .env
    volumes:
      - ../migration_sources:/app/migration_sources:ro
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    command: sh -c "python manage.py migrate --check && exec celery -A config worker -l info"
    env_file:
      - .env
    volumes:
      - ../migration_sources:/app/migration_sources:ro
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  kafka-scheduler:
    build:
      context: ../backend
    restart: unless-stopped
    profiles: ["kafka"]
    env_file: [.env]
    command: celery -A config.kafka_scheduler beat -l info --pidfile= --schedule=/tmp/openlims-kafka-schedule
    depends_on: [worker]

  qc-worker:
    build:
      context: ../backend
    restart: unless-stopped
    env_file: [.env]
    command: >-
      sh -c "python manage.py migrate --check &&
      exec celery -A config worker -l info -Q instrument_qc -n instrument-qc@%h
      --concurrency=1 --prefetch-multiplier=1"
    networks: [instrument_qc]
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 96
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d instrument-qc@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 5

  assistant-monitor:
    build:
      context: ../backend
    restart: unless-stopped
    command: python manage.py monitor_assistant_actions --interval 60
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "${OPENLIMS_HTTP_PORT:-8080}:80"
    volumes:
      - media_data:/srv/openlims/media:ro
      - static_data:/srv/openlims/static:ro
    depends_on:
      api:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["llm"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  ollama_data:

networks:
  instrument_qc:
    internal: true
