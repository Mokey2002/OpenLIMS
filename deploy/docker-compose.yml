version: "3.9"

services:
  db:
    networks: [default, instrument_qc]
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: openlims-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # avoid local 5432 conflicts

  redis:
    networks: [default, instrument_qc]
    image: ${REDIS_IMAGE:-redis:7}
    container_name: openlims-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ../backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    container_name: openlims-api
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ../backend:/app
      - ../migration_sources:/app/migration_sources:ro
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis

  worker:
    restart: unless-stopped
    build:
      context: ../backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    container_name: openlims-worker
    command: sh -c "python manage.py migrate --check && exec celery -A config worker -l info"
    volumes:
      - ../backend:/app
      - ../migration_sources:/app/migration_sources:ro
      - media_data:/app/media
    env_file:
      - .env
    depends_on:
      - db
      - redis


  qc-worker:
    build:
      context: ../backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    env_file: [.env]
    command: >-
      sh -c "python manage.py migrate --check &&
      exec celery -A config worker -l info -Q instrument_qc -n instrument-qc@%h
      --concurrency=1 --prefetch-multiplier=1"
    networks: [instrument_qc]
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 96
    depends_on: [api]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d instrument-qc@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 5

  assistant-monitor:
    build:
      context: ../backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    command: python manage.py monitor_assistant_actions --interval 60
    volumes:
      - ../backend:/app
    env_file:
      - .env
    depends_on:
      - api
      - db

  ollama:
    image: ollama/ollama:latest
    container_name: openlims-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
  postgres_data:
  media_data:
  static_data:

networks:
  instrument_qc:
    internal: true
